name: Build Tizen TPK via Docker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-tizen-tpk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Tizen Web TPK
        uses: addnab/docker-run-action@v3
        with:
          image: ubuntu:20.04
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y wget unzip openjdk-8-jre-headless zip

            echo "=== Downloading Tizen Web CLI ==="
            wget --quiet https://download.tizen.org/sdk/tizenstudio/official/binary/tizen-studio_5.0_ubuntu-64.bin -O tizen-studio.bin
            chmod +x tizen-studio.bin

            echo "=== Installing Tizen Studio CLI ==="
            mkdir -p /opt/tizen-sdk
            ./tizen-studio.bin --accept-license /opt/tizen-sdk || true

            export PATH=$PATH:/opt/tizen-sdk/tools/ide/bin

            echo "=== Building TPK ==="
            mkdir -p /workspace/output
            tizen package -t tpk -o /workspace/output -- /workspace

            echo "=== Build Finished Successfully ==="

      - name: Upload TPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tizen-Web-App-TPK
          path: output/*.tpk
          if-no-files-found: error
