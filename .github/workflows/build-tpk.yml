name: Build Tizen TPK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-tizen-tpk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (Optional)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create Tizen Web App TPK Package
        run: |
          mkdir -p output
          
          # টাইজেন ওয়েব অ্যাপ হলো মূলত একটি জিপ আর্কাইভ।
          # config.xml এবং index.html সহ প্রয়োজনীয় অ্যাসেট ফাইলগুলো জিপ করে .tpk রিনেম করা হচ্ছে।
          
          echo "=== Packaging Web App into TPK ==="
          
          if [ -d "css" ] && [ -d "js" ]; then
            zip -r output/TestWebViewApp.tpk config.xml index.html css js
          elif [ -d "css" ]; then
            zip -r output/TestWebViewApp.tpk config.xml index.html css
          elif [ -d "js" ]; then
            zip -r output/TestWebViewApp.tpk config.xml index.html js
          else
            zip -r output/TestWebViewApp.tpk config.xml index.html
          fi
          
          echo "=== Build Complete Successfully ==="
          ls -la output/

      - name: Upload TPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tizen-Web-App-TPK
          path: output/*.tpk
          if-no-files-found: error
